name: Task
description: Track an internal development task.
title: "[Task] "
labels: ["type:task"]
body:
    -
        type: textarea
        id: purpose
        attributes:
            label: Purpose
            description: Describe why this task is needed and the high-level outcome it should achieve.
            placeholder: |
                - Why is this task needed?
                - What high-level outcome should be true when the task is complete?
        validations:
            required: true

    -
        type: textarea
        id: known-impact
        attributes:
            label: Known impact
            description: Separate known required changes from anticipated optional supporting tools; an optional tool is not required for acceptance and its internal contracts are not issue requirements.
            placeholder: |
                ### Required direct or consequential changes
                - `path/to/file`: Required outcome or reason for the change

                ### Anticipated optional supporting tools
                - `path/to/tool`: Why it may help; inclusion is not required for acceptance
                - None
        validations:
            required: true

    -
        type: textarea
        id: detailed-requirements
        attributes:
            label: Detailed requirements
            description: State the mandatory behavior and scope boundaries without prescribing implementation choices.
            placeholder: |
                - Required behavior or result:
                - In scope:
                - Out of scope:
        validations:
            required: true

    -
        type: textarea
        id: verification-acceptance
        attributes:
            label: Verification and acceptance
            description: Define objective outcomes and evidence that distinguish a complete task from one that still requires assumptions.
            placeholder: |
                - Acceptance outcome:
                - Verification method or evidence:
                - Insufficient or rejected case:
        validations:
            required: true

    -
        type: textarea
        id: constraints
        attributes:
            label: Constraints
            description: List actual schedule, technical, operational, or policy constraints; use None when there are none.
            placeholder: |
                - Schedule constraint:
                - Essential technical or implementation constraint:
                - Operational constraint:
                - Policy constraint:
                - None
        validations:
            required: true
